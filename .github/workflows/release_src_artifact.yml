name: Release source tarball

on:
  push:
    tags:
      - 'v*'
  # Builds the tarball without publishing it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the release source tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arrayfire-full-${{ steps.version.outputs.version }}
          persist-credentials: false
      - name: Create the source tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "arrayfire-full-$VERSION/.github/scripts/make-source-tarball.sh" "$RUNNER_TEMP/"
          "$RUNNER_TEMP/make-source-tarball.sh" "arrayfire-full-$VERSION" "$VERSION"
      - name: Keep the tarball as an artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: arrayfire-full-${{ steps.version.outputs.version }}.tar.bz2
          archive: false
          if-no-files-found: error

  # The only job that can write to the repository, and only for a version tag.
  upload:
    name: Upload release source tarball
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TARBALL: arrayfire-full-${{ needs.build.outputs.version }}.tar.bz2
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.TARBALL }}
      - name: Upload the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$TARBALL" --repo "$GITHUB_REPOSITORY" --clobber
