on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

name: ci

jobs:
    window_build_cpu:
        name: CPU (fftw, OpenBLAS, windows-2022)
        runs-on: windows-2022
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
          # vcpkg 2026.10.16 supplies current MSYS2 tools; vcpkg.json pins ports.
          VCPKG_TOOL_REF: 9eec002df1cd109f8f104cd966a763daf9751489
        steps:
            - name: Checkout Repository
              uses: actions/checkout@master

            - name: Read VCPKG Baseline
              id: baseline
              shell: pwsh
              run: |
                  $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
                  if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'Invalid vcpkg baseline' }
                  "commit=$baseline" >> $env:GITHUB_OUTPUT
                  "VCPKG_ROOT=$env:RUNNER_TEMP/arrayfire-vcpkg" >> $env:GITHUB_ENV

            - name: VCPKG Binary Cache
              uses: actions/cache@v6.1.0
              with:
                  path: ~/AppData/Local/vcpkg/archives
                  key: windows-vcpkg-${{ env.VCPKG_TOOL_REF }}-${{ steps.baseline.outputs.commit }}-${{ hashFiles('vcpkg.json', 'CMakeModules/vcpkg/**') }}

            - name: Install VCPKG
              shell: pwsh
              run: |
                  git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  git -C $env:VCPKG_ROOT checkout $env:VCPKG_TOOL_REF
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }

            - name: CMake Configure
              shell: pwsh
              run: |
                  $buildname = "PR-${{ github.event.number }}-cpu-openblas"
                  if ('${{ github.event_name }}' -eq 'push') { $buildname = 'master-cpu-openblas' }
                  cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
                      "-DVCPKG_ROOT:PATH=$env:VCPKG_ROOT" `
                      -DAF_BUILD_CUDA:BOOL=OFF -DAF_BUILD_OPENCL:BOOL=OFF `
                      -DAF_BUILD_UNIFIED:BOOL=OFF -DAF_BUILD_FORGE:BOOL=ON `
                      -DBUILDNAME:STRING="$buildname" `
                      -DAF_COMPUTE_LIBRARY:STRING="FFTW/LAPACK/BLAS"
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }

            - name: Build and Test
              shell: pwsh
              run: |
                  cmake --build build --config RelWithDebInfo --parallel 2
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  $env:PATH += ";$env:GITHUB_WORKSPACE/build/vcpkg_installed/x64-windows/bin"
                  ctest --test-dir build -C RelWithDebInfo -R cpu -E pinverse --output-on-failure -j2
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
